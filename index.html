<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lintian 的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        /* 页面背景：蓝色 */
        body {
            background-color: #4a90e2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 中间卡片：绿色底色 */
        .card {
            background: #2ecc71; /* 绿色 */
            color: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .love {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
        }

        .phone {
            font-size: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>你好，我是 lintian</h1>
        
        <div class="love">🍜 我的爱好：超级爱吃文昌炒粉</div>
        
        <div class="phone">📞 联系电话：13976343749</div>
    </div>
</body>
</html>
